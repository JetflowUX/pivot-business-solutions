<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Cartouche corner volute, oriented top-left, drawn heavy enough to read
       as a scrolled shield corner rather than a speck.
       Rotated 90/180/270deg in CSS for the other three corners. -->
  <g fill="#fff" fill-opacity=".95">
    <!-- acanthus tongue springing along the diagonal -->
    <path d="M15 15 C24 18 31 25 33.5 34.5 C28.8 30.3 24.2 27.8 19.2 26.9
             C22.6 24.2 23.8 21.2 22.9 17.9 C21.1 18.8 18.4 18.2 15 15 Z"/>
  </g>
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- the elbow, doubled -->
    <path stroke-width="2.8" d="M4 34 C4 17 17 4 34 4"/>
    <path stroke-width="1.3" d="M10.5 34.6 C10.5 21.4 21.4 10.5 34.6 10.5"/>

    <!-- volute closing the horizontal arm -->
    <path stroke-width="2.4" d="M34 4 C45 4 51 10.4 47.8 16.6 C45.2 21.6 37 20.6 35.8 14.8
                                C35 10.8 38.8 8.6 40.9 11.1"/>
    <!-- volute closing the vertical arm -->
    <path stroke-width="2.4" d="M4 34 C4 45 10.4 51 16.6 47.8 C21.6 45.2 20.6 37 14.8 35.8
                                C10.8 35 8.6 38.8 11.1 40.9"/>

    <!-- fine tendrils inside each volute -->
    <g stroke-width="1.1" opacity=".85">
      <path d="M41.5 8.5 C45.5 9.5 47.5 12.5 46 15.5"/>
      <path d="M8.5 41.5 C9.5 45.5 12.5 47.5 15.5 46"/>
    </g>
  </g>
</svg>
