<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 44" width="60" height="44">
  <!-- Baroque running scroll, repeat unit 60 x 44, seamless at x=0 and x=60.
       Two ink weights: a heavy stem carrying large volutes, and a fine
       counter-line with acanthus filling the field above and below it.
       Worn as a CSS mask; the mustard accents live in orn-frieze-accent.svg
       so the band can be laid up in two colours. -->

  <!-- filled acanthus, laid first so strokes read over it -->
  <g fill="#fff" fill-opacity=".92">
    <path d="M15 12 C11.6 10.2 9 6.8 8.2 2.6 C11.4 4.6 14 5.7 16.6 5.9 C14.9 8 14.6 9.9 15 12 Z"/>
    <path d="M15 12 C18.4 10.2 21 6.8 21.8 2.6 C18.6 4.6 16 5.7 13.4 5.9 C15.1 8 15.4 9.9 15 12 Z"/>
    <path d="M45 32 C41.6 33.8 39 37.2 38.2 41.4 C41.4 39.4 44 38.3 46.6 38.1 C44.9 36 44.6 34.1 45 32 Z"/>
    <path d="M45 32 C48.4 33.8 51 37.2 51.8 41.4 C48.6 39.4 46 38.3 43.4 38.1 C45.1 36 45.4 34.1 45 32 Z"/>
  </g>

  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">

    <!-- heavy stem -->
    <path stroke-width="2.6" d="M0 22 C10 6 22 6 30 22 C38 38 50 38 60 22"/>

    <!-- fine counter-line shadowing the stem -->
    <path stroke-width="1" opacity=".8" d="M0 26.6 C10.5 11.4 21.5 11.4 30 26.6"/>
    <path stroke-width="1" opacity=".8" d="M30 17.4 C38.5 32.6 49.5 32.6 60 17.4"/>

    <!-- large volute inside the upper bow -->
    <path stroke-width="1.7" transform="translate(15 15)"
          d="M6 0 C6 3.3 3.3 6 0 6 C-3.3 6 -6 3.3 -6 0 C-6 -2.6 -4 -4.6 -1.9 -4.6 C0.2 -4.6 1.9 -2.9 1.9 -1.1 C1.9 0.3 1 1.3 -0.1 1.3"/>

    <!-- large volute inside the lower bow, turned through 180 -->
    <path stroke-width="1.7" transform="translate(45 29) rotate(180)"
          d="M6 0 C6 3.3 3.3 6 0 6 C-3.3 6 -6 3.3 -6 0 C-6 -2.6 -4 -4.6 -1.9 -4.6 C0.2 -4.6 1.9 -2.9 1.9 -1.1 C1.9 0.3 1 1.3 -0.1 1.3"/>

    <!-- tendrils springing off the stem crossings -->
    <g stroke-width="1.15">
      <path d="M30 22 C33.6 19.4 37.6 19.8 38.6 22.6 C39.4 24.9 37 26.6 35.4 25.2"/>
      <path d="M30 22 C26.4 24.6 22.4 24.2 21.4 21.4 C20.6 19.1 23 17.4 24.6 18.8"/>
      <path d="M0 22 C3.6 19.4 7.6 19.8 8.6 22.6 C9.4 24.9 7 26.6 5.4 25.2"/>
      <path d="M60 22 C56.4 24.6 52.4 24.2 51.4 21.4 C50.6 19.1 53 17.4 54.6 18.8"/>
    </g>

    <!-- hairline rules closing the band top and bottom -->
    <path stroke-width="0.9" opacity=".55" d="M0 1.4 H60 M0 42.6 H60"/>
  </g>
</svg>
