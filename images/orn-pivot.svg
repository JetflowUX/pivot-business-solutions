<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The pivot device, redrawn in the azulejo grammar:
       one foot planted (the quatrefoil), the other turning (the quarter arc).
       Used as a mask; ink colour comes from a token. -->
  <g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- the turn -->
    <path d="M15 49 A34 34 0 0 1 47 17"/>
    <!-- the new heading -->
    <path d="M47 17 L37.6 18.4 M47 17 L45.6 26.4"/>
  </g>
  <g fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- acanthus curls at both ends of the turn -->
    <path d="M15 49 C8.6 50.4 5.4 55 8.2 57.8 C10.6 60.2 14.6 58 13.2 55"/>
    <path d="M47 17 C52.8 13.2 57.6 14.4 58.4 18.2 C59.1 21.4 55.4 23.5 53.5 20.9"/>
  </g>
  <!-- the planted foot -->
  <g fill="#fff" transform="translate(15 49)">
    <circle cx="0" cy="-3.8" r="3"/><circle cx="3.8" cy="0" r="3"/>
    <circle cx="0" cy="3.8" r="3"/><circle cx="-3.8" cy="0" r="3"/>
  </g>
</svg>
