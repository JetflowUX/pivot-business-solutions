<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60">
  <!-- Padrão: a seamlessly tiling azulejo pattern field, 60x60 repeat.
       Corner quarter-arcs meet across the seam to form full circles;
       an eight-point star sits at the centre of every tile.
       Used as a mask; ink colour comes from a token. -->
  <g fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round">
    <!-- corner quarter-arcs (r=13) -->
    <path d="M13 0 A13 13 0 0 1 0 13"/>
    <path d="M47 0 A13 13 0 0 0 60 13"/>
    <path d="M0 47 A13 13 0 0 0 13 60"/>
    <path d="M60 47 A13 13 0 0 1 47 60"/>

    <!-- diagonal stems running corner to centre -->
    <path d="M9.2 9.2 L22 22"/>
    <path d="M50.8 9.2 L38 22"/>
    <path d="M9.2 50.8 L22 38"/>
    <path d="M50.8 50.8 L38 38"/>

    <!-- eight-point star at centre -->
    <path d="M30 16 L34 26 L44 30 L34 34 L30 44 L26 34 L16 30 L26 26 Z"/>
    <path d="M30 21.5 L32.6 27.4 L38.5 30 L32.6 32.6 L30 38.5 L27.4 32.6 L21.5 30 L27.4 27.4 Z"/>

    <!-- edge buds, seamless across the seam -->
    <g stroke-width="1.15">
      <path d="M30 0 C27.8 3.2 27.8 6.4 30 8.6 C32.2 6.4 32.2 3.2 30 0"/>
      <path d="M30 60 C27.8 56.8 27.8 53.6 30 51.4 C32.2 53.6 32.2 56.8 30 60"/>
      <path d="M0 30 C3.2 27.8 6.4 27.8 8.6 30 C6.4 32.2 3.2 32.2 0 30"/>
      <path d="M60 30 C56.8 27.8 53.6 27.8 51.4 30 C53.6 32.2 56.8 32.2 60 30"/>
    </g>
  </g>
  <g fill="#fff">
    <circle cx="30" cy="30" r="2.2"/>
    <circle cx="0" cy="0" r="1.6"/><circle cx="60" cy="0" r="1.6"/>
    <circle cx="0" cy="60" r="1.6"/><circle cx="60" cy="60" r="1.6"/>
  </g>
</svg>
