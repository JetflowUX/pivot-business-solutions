<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 44" width="60" height="44">
  <!-- The mustard pass of the frieze: fleurons on the stem nodes and the eyes
       of the two volutes. Registered to orn-frieze.svg, same 60x44 unit, so
       the band can be laid up as two masked layers in two inks. -->
  <g fill="#fff">
    <!-- node fleurons at x = 0, 30, 60 -->
    <g transform="translate(0 22)">
      <circle cx="0" cy="-2.6" r="2.1"/><circle cx="2.6" cy="0" r="2.1"/>
      <circle cx="0" cy="2.6" r="2.1"/><circle cx="-2.6" cy="0" r="2.1"/>
    </g>
    <g transform="translate(60 22)">
      <circle cx="0" cy="-2.6" r="2.1"/><circle cx="2.6" cy="0" r="2.1"/>
      <circle cx="0" cy="2.6" r="2.1"/><circle cx="-2.6" cy="0" r="2.1"/>
    </g>
    <g transform="translate(30 22)">
      <circle cx="0" cy="-2.6" r="2.1"/><circle cx="2.6" cy="0" r="2.1"/>
      <circle cx="0" cy="2.6" r="2.1"/><circle cx="-2.6" cy="0" r="2.1"/>
    </g>
    <!-- eyes of the two volutes -->
    <circle cx="15" cy="15" r="2"/>
    <circle cx="45" cy="29" r="2"/>
  </g>
</svg>
