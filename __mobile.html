<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mobile harness</title>
<style>
  html,body{margin:0;padding:0;background:#000}
  iframe{display:block;border:0;width:390px;background:#0D0D0F}
</style>
</head>
<body>
<iframe id="f" height="844"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  if (q.get('h')) f.height = q.get('h');
  f.src = (q.get('p') || 'index.html');
  f.addEventListener('load', function () {
    setTimeout(function () {
      var d = f.contentDocument, vw = d.documentElement.clientWidth, out = [];
      if (q.get('full')) f.style.height = d.documentElement.scrollHeight + 'px';
      d.querySelectorAll('*').forEach(function (el) {
        var r = el.getBoundingClientRect();
        if (r.width > vw + 0.5 || r.right > vw + 0.5) {
          out.push(el.tagName.toLowerCase() + '.' +
            (el.className || '').toString().split(' ').filter(Boolean).slice(0, 2).join('.') +
            ' w=' + Math.round(r.width) + ' right=' + Math.round(r.right));
        }
      });
      document.title = 'VW=' + vw + ' SCROLLW=' + d.documentElement.scrollWidth +
        ' || ' + (out.slice(0, 12).join(' ;; ') || 'no overflow');
    }, 400);
  });
</script>
</body>
</html>
